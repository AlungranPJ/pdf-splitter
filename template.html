<!DOCTYPE html>
<html lang="/*HTMLLANG*/">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="/*CSP*/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3a9be0">
<!--HEADTAGS-->
<style>
  :root {
    --ink:#14283c; --ink2:#46596d; --edge:rgba(10,40,70,.6);
    --font:"Segoe UI","Leelawadee UI","Noto Sans Thai",Tahoma,system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html { background:#62bdf0; scrollbar-color:#7fa6cf #e6eef7; }
  body { margin:0; min-height:100vh; color:var(--ink); font:15px/1.5 var(--font); }
  ::selection { background:#3399ff; color:#fff; }
  input { caret-color:#1a5fb4; }
  a { color:#0b57a6; text-underline-offset:2px; }
  .hide { display:none !important; }
  :is(button,input,summary,.pg):focus-visible { outline:2px solid #2b7fd6; outline-offset:2px; box-shadow:0 3px 6px rgba(255,255,255,.8); }

  /* ---------- Aero wallpaper (all authored, no network) ---------- */
  .scene { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 40% at 82% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
      linear-gradient(#2a97de 0%, #55b6ee 32%, #9bdcf7 62%, #d6f3e6 88%, #eaf9df 100%); }
  .sun { position:absolute; right:6%; top:-14%; width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle, #fff 0 7%, rgba(255,255,236,.92) 11%, rgba(255,255,255,.4) 30%, rgba(255,255,255,0) 62%); }
  .rays { position:absolute; inset:0;
    background:repeating-conic-gradient(from 198deg at 84% 2%, rgba(255,255,255,.24) 0 2.5deg, rgba(255,255,255,0) 2.5deg 8deg);
    -webkit-mask-image:radial-gradient(circle at 84% 2%, #000 0, rgba(0,0,0,.55) 45%, transparent 78%);
            mask-image:radial-gradient(circle at 84% 2%, #000 0, rgba(0,0,0,.55) 45%, transparent 78%); }
  .clouds { position:absolute; inset:0;
    background:
      radial-gradient(ellipse 220px 54px at 14% 20%, rgba(255,255,255,.85), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 140px 40px at 20% 23%, rgba(255,255,255,.8), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 260px 60px at 58% 30%, rgba(255,255,255,.7), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 170px 44px at 66% 34%, rgba(255,255,255,.7), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 200px 48px at 36% 50%, rgba(255,255,255,.55), rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 240px 50px at 90% 46%, rgba(255,255,255,.55), rgba(255,255,255,0) 72%); }
  .hills { position:absolute; left:0; bottom:38px; width:100%; height:34vh; min-height:170px; }
  .grass { position:absolute; left:0; bottom:0; width:100%; height:64px; }
  .bubble { position:absolute; left:var(--x); bottom:-180px; width:var(--s); height:var(--s); border-radius:50%; opacity:0;
    background:radial-gradient(circle at 32% 27%, rgba(255,255,255,.96) 0 6%, rgba(255,255,255,.28) 17%, rgba(170,226,255,.10) 58%, rgba(255,255,255,.5) 91%, rgba(255,255,255,.88) 100%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:inset -6px -8px 14px rgba(110,196,255,.38), inset 4px 5px 10px rgba(255,255,255,.55), 0 5px 12px rgba(0,80,140,.14);
    animation:rise var(--d) linear var(--delay) infinite; }
  @keyframes rise {
    0% { transform:translate(0,0); opacity:0; }
    8% { opacity:.92; }
    50% { transform:translate(30px,-58vh); }
    92% { opacity:.92; }
    100% { transform:translate(-20px,-118vh); opacity:0; }
  }
  @media (prefers-reduced-motion:reduce) {
    .bubble { animation:none; opacity:.85; bottom:var(--y); }
  }

  /* ---------- Window: Win7 glass frame ---------- */
  .win { position:relative; max-width:1120px; margin:26px auto 100px; padding:3px 8px 8px; border-radius:9px;
    border:1px solid var(--edge);
    background:
      linear-gradient(115deg, rgba(255,255,255,.62) 0 22%, rgba(255,255,255,.10) 22% 44%, rgba(255,255,255,.36) 44% 56%, rgba(255,255,255,.12) 56% 100%),
      linear-gradient(rgba(196,229,252,.62), rgba(140,200,240,.55));
    -webkit-backdrop-filter:blur(16px) saturate(1.5); backdrop-filter:blur(16px) saturate(1.5);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.72), 0 14px 42px rgba(0,45,90,.42), 0 2px 6px rgba(0,30,60,.35); }
  .titlebar { display:flex; align-items:center; gap:8px; height:36px; padding-left:4px; }
  .titlebar svg.appico { width:20px; height:20px; flex:none; }
  h1 { margin:0; font-size:15px; font-weight:400; color:#0a1d31; letter-spacing:.1px;
    text-shadow:0 0 10px #fff, 0 0 5px #fff, 0 0 3px #fff; }
  .caps { margin-left:auto; align-self:flex-start; display:flex; margin-right:-3px; }
  .caps button { position:relative; display:grid; place-items:center; height:21px; min-height:0; padding:0; margin:0 0 0 -1px; cursor:pointer; color:#1a2f45;
    border:1px solid var(--edge); border-top:0; border-radius:0; box-shadow:none;
    background:linear-gradient(rgba(255,255,255,.75) 0 48%, rgba(170,205,238,.75) 52%);
    transition:background .15s ease, box-shadow .15s ease; }
  .caps svg { width:14px; height:14px; }
  .caps .iu, .caps .it { display:none; }
  .caps .c1 { width:29px; border-radius:0 0 0 5px; }
  .caps .c2 { width:27px; }
  .caps .c3 { width:47px; border-radius:0 0 5px 0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);
    background:linear-gradient(#efb2a6 0 48%, #c73f29 52%, #e0765a 100%); }
  .caps button:hover:not(:disabled) { background:linear-gradient(#f7fcff 0 48%, #a9d7f4 52%, #cbe9fb 100%); border-color:var(--edge);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.8), 0 2px 6px rgba(40,120,200,.5); }
  .caps button:active:not(:disabled) { background:linear-gradient(#8fc3e8 0 48%, #5a9fd3 52%, #78b6e2 100%); border-color:var(--edge);
    box-shadow:inset 0 1px 3px rgba(0,40,80,.45); }
  .caps .c3:hover:not(:disabled) { background:linear-gradient(#f6c4ba 0 48%, #dc4a30 52%, #f08a6a 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7), 0 2px 6px rgba(200,50,30,.55); }
  .caps .c3:active:not(:disabled) { background:linear-gradient(#c0442d 0 48%, #8f2714 52%, #b8452c 100%);
    box-shadow:inset 0 1px 3px rgba(60,0,0,.5); }
  .caps button:focus-visible { outline-offset:-5px; }
  .caps button.c3.nope :is(svg,.it) { animation:nope .42s ease; }
  @keyframes nope { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-2.5px); } 40% { transform:translateX(2.5px); } 60% { transform:translateX(-2px); } 80% { transform:translateX(2px); } }

  /* ---------- Easter egg: the decorative close button points at the real one ---------- */
  .oops { position:fixed; inset:0; z-index:100; pointer-events:none; overflow:hidden; }
  .oops-cur { position:absolute; left:0; top:0; width:26px; height:29px; opacity:0; transform-origin:1px 1px;
    filter:drop-shadow(1px 2px 2px rgba(0,30,60,.55)); will-change:transform,opacity; }
  .oops-tip { position:absolute; right:12px; top:56px; max-width:min(270px, calc(100vw - 24px)); padding:8px 13px; opacity:0; transform-origin:92% 0;
    font-size:14px; font-weight:600; color:#111; background:linear-gradient(#ffffef, #ffffd3); border:1px solid #767676; border-radius:5px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.8), 0 3px 8px rgba(0,30,60,.4); }
  .oops-tip::before { content:""; position:absolute; top:-8px; right:16px; width:13px; height:13px; transform:rotate(45deg);
    background:#ffffef; border-left:1px solid #767676; border-top:1px solid #767676; }
  .addr { display:flex; gap:8px; align-items:center; padding:3px 0 9px; }
  .abar { flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:4px 10px; border-radius:3px;
    background:linear-gradient(#fff, #f4f8fc); border:1px solid #6f8aa8; border-top-color:#4d6a8a;
    box-shadow:inset 0 1px 2px rgba(0,30,60,.18), 0 1px 0 rgba(255,255,255,.7); }
  .abar svg { width:18px; height:18px; flex:none; }
  .abar .hint { color:var(--ink); font-size:14px; }
  .client { background:#fff; border:1px solid var(--edge); border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,.55); }

  /* ---------- Win7 push buttons + gel ---------- */
  button { font:inherit; font-size:14px; color:#111; cursor:pointer; min-height:34px; padding:6px 14px; border-radius:3px;
    background:linear-gradient(#f6f6f6 0 48%, #e3e3e3 52%, #d2d2d2 100%);
    border:1px solid #6b6f74; box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);
    transition:background .15s ease, border-color .15s ease, box-shadow .15s ease; }
  button:hover:not(:disabled) { background:linear-gradient(#eef8fe 0 48%, #d3ecfb 52%, #a9d9f5 100%); border-color:#2c7cb6; box-shadow:inset 0 0 0 1px rgba(255,255,255,.9), 0 2px 6px rgba(30,120,200,.4); }
  button:active:not(:disabled) { background:linear-gradient(#c5e6f8 0 48%, #93cdee 52%, #7cc0e8 100%); border-color:#245f8c; box-shadow:inset 0 1px 3px rgba(0,50,90,.35); }
  button:disabled { cursor:not-allowed; color:#767b80; background:linear-gradient(#f5f5f5, #ebebeb); border-color:#adb2b5; box-shadow:none; }
  button.primary, button.alt { color:#fff; font-weight:600; text-shadow:0 1px 1px rgba(0,25,60,.75), 0 0 3px rgba(0,25,60,.4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 6px rgba(255,255,255,.28), 0 2px 5px rgba(0,50,100,.35); }
  button.primary { background:linear-gradient(#5fb0ea 0 49%, #1d5fb0 51%, #2f86d8 100%); border-color:#154a86; }
  button.primary:hover:not(:disabled) { background:linear-gradient(#8ccbf6 0 49%, #2a77cc 51%, #52aef0 100%); border-color:#154a86; box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 3px 8px rgba(20,90,180,.5); }
  button.primary:active:not(:disabled) { background:linear-gradient(#2c73c0 0 49%, #124a90 51%, #2470c0 100%); }
  button.alt { background:linear-gradient(#69bd45 0 49%, #237414 51%, #3f9f27 100%); border-color:#1b5a10; }
  button.alt:hover:not(:disabled) { background:linear-gradient(#93d872 0 49%, #2f8a1c 51%, #5cc03c 100%); border-color:#1b5a10; box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 3px 8px rgba(20,100,20,.5); }
  button.alt:active:not(:disabled) { background:linear-gradient(#2f8a1c 0 49%, #175c0c 51%, #2a7a18 100%); }
  button.primary:disabled, button.alt:disabled { color:#6a7178; text-shadow:none; background:linear-gradient(#f0f0f0, #e2e2e2); border-color:#adb2b5; }
  button.big { min-height:46px; padding:9px 28px; font-size:16px; border-radius:6px; }
  #lang { min-width:52px; }

  /* ---------- Privacy bar (green, Action Center style) ---------- */
  .privacy { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:start; margin:16px 16px 14px; padding:11px 14px;
    color:#1d3a12; border:1px solid #7fb958; border-radius:4px;
    background:linear-gradient(#f3fbea, #d9f0c4); box-shadow:inset 0 0 0 1px rgba(255,255,255,.8), 0 1px 3px rgba(20,80,20,.18); }
  .privacy > svg { width:34px; height:34px; grid-row:1 / span 3; margin-top:1px; filter:drop-shadow(0 1px 2px rgba(20,80,20,.4)); }
  .privacy b { color:#17520a; }
  .privacy .hint { color:#2c4f1f; }
  .privacy details { color:#2c4f1f; font-size:13.5px; }
  .privacy summary { cursor:pointer; color:#17400c; font-weight:600; width:max-content; max-width:100%; }
  .privacy ul { margin:6px 0 2px; padding-left:20px; }
  .privacy li { margin:2px 0; }

  /* ---------- Drop zone ---------- */
  #drop { margin:0 16px 20px; padding:30px 20px 34px; text-align:center; border-radius:6px; border:1px solid #b6cce3;
    outline:2px dashed #8fb1d6; outline-offset:-9px;
    background:radial-gradient(ellipse 80% 90% at 50% 0%, #fff, #ecf5fc 62%, #dcebf8 100%);
    box-shadow:inset 0 1px 0 #fff; transition:background .15s ease, outline-color .15s ease, box-shadow .15s ease; cursor:pointer; }
  #drop.over { background:radial-gradient(ellipse 80% 90% at 50% 0%, #fff, #d9edff 60%, #bcdcf7 100%); outline-color:#2a7fd0; box-shadow:0 3px 8px rgba(30,110,200,.35); }
  #drop .big-ico { width:104px; height:104px; filter:drop-shadow(0 6px 8px rgba(20,60,110,.35)); }
  #drop p { margin:6px 0 18px; color:var(--ink2); font-size:16px; }

  /* ---------- Explorer command bar ---------- */
  .tools { z-index:5; background:linear-gradient(#fdfeff, #e8f0f9); border-top:1px solid #fff; border-bottom:1px solid #a9bdd3;
    box-shadow:0 2px 5px rgba(0,40,80,.14); }
  @media (min-width:700px) { .tools { position:sticky; top:0; } }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:9px 16px; }
  .bar + .bar { border-top:1px solid rgba(150,175,205,.55); }
  .bar b { color:var(--ink); }
  .bar input[type=text] { width:200px; min-height:34px; padding:5px 9px; color:var(--ink); font:inherit; font-size:14px; background:#fff;
    border:1px solid #abadb3; border-top-color:#8e97a3; border-radius:2px; box-shadow:inset 0 1px 2px rgba(0,30,60,.15); }
  .bar input[type=text]:focus { border-color:#3399ff; box-shadow:inset 0 1px 2px rgba(0,30,60,.12), 0 2px 5px rgba(30,110,200,.45); outline:0; }
  .sp { flex:1; }
  .hint { color:var(--ink2); font-size:13.5px; }
  #msg { color:#17600a; font-size:13.5px; font-weight:600; }
  .howto { padding:10px 16px 6px; }

  /* ---------- Thumbnails (Explorer "large icons") ---------- */
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px 8px; padding:6px 16px 20px; }
  .pg { position:relative; padding:9px 9px 7px; border:1px solid transparent; border-radius:4px; cursor:pointer; user-select:none;
    transition:background .15s ease, border-color .15s ease; }
  .pg:hover { background:linear-gradient(#fdfeff, #e8f4fd); border-color:#c6dcf2; box-shadow:inset 0 0 0 1px rgba(255,255,255,.85); }
  .pg.sel { background:linear-gradient(#eaf6ff, #c4e3fa); border-color:#77a6d8; box-shadow:inset 0 0 0 1px rgba(255,255,255,.9); }
  .pg canvas { width:100%; height:auto; display:block; background:#fff; border:1px solid #93a5b8; box-shadow:0 3px 7px rgba(20,50,90,.35); }
  .pg .n { text-align:center; color:var(--ink); font-size:13.5px; margin-top:9px; }
  .pg.sel .n { font-weight:600; color:#0d3a6e; }
  .pg .ck { position:absolute; top:14px; right:14px; width:26px; height:26px; opacity:0; transform:scale(.55);
    transition:opacity .16s ease, transform .16s cubic-bezier(.2,.9,.3,1.3); filter:drop-shadow(0 2px 3px rgba(0,40,90,.5)); }
  .pg.sel .ck { opacity:1; transform:none; }

  .status { margin-top:2px; padding:7px 16px; text-align:center; color:var(--ink2); font-size:12.5px;
    background:linear-gradient(#f7fafd, #e2ebf5); border-top:1px solid #b3c5d9; }

  /* ---------- Small screens ---------- */
  @media (max-width:699px) {
    .win { margin:8px 6px 84px; padding:0 5px 5px; }
    .titlebar { height:32px; }
    h1 { font-size:14px; }
    .caps .c1, .caps .c2 { width:24px; } .caps .c3 { width:38px; }
    .caps button::after { content:""; position:absolute; inset:-8px 0 -10px 0; }
    .caps .c1::after { left:-4px; }
    .caps .c3::after { right:-6px; }
    .privacy { margin:12px 10px; padding:10px; grid-template-columns:auto 1fr; }
    .privacy > svg { width:28px; height:28px; }
    #drop { margin:0 10px 14px; padding:22px 14px 26px; }
    #drop .big-ico { width:84px; height:84px; }
    .bar { padding:8px 10px; }
    .bar input[type=text] { flex:1 1 100%; width:auto; }
    button { min-height:40px; padding:8px 14px; }
    .howto { padding:8px 10px 4px; }
    #grid { padding:6px 10px 16px; gap:4px 6px; }
    .hills { height:22vh; }
    .sun { width:400px; height:400px; }
  }

  /* ===================== Language indicator (Windows 7 language bar) ===================== */
  .langbar { display:inline-flex; align-items:center; gap:6px; min-width:0; padding:4px 9px 4px 7px; color:#14283c; border-color:#5d7fa6;
    background:linear-gradient(#ffffff 0 48%, #dbe8f6 52%, #c7dbef 100%); }
  .langbar .kb { width:20px; height:14px; flex:none; }
  .langbar .lcode { min-width:1.7em; text-align:center; font-weight:700; font-size:13.5px; letter-spacing:.5px; }
  .langbar .dd { width:8px; height:5px; flex:none; opacity:.7; }

  /* Alternate desktops are hidden until a theme is chosen with the window buttons */
  .scene-ub, .ub-shell, .ascii { display:none; }

  /* ===================== Theme: Ubuntu 22.04 (maximize button) ===================== */
  html[data-theme="ubuntu"] { --ink:#2e3436; --ink2:#5d6366; --edge:#c3c0bb;
    --font:"Ubuntu","Cantarell","Segoe UI","Leelawadee UI","Noto Sans Thai",system-ui,sans-serif;
    background:#1b0a2a; scrollbar-color:#8a8580 #2a1236; }
  html[data-theme="ubuntu"] ::selection { background:#e95420; color:#fff; }
  html[data-theme="ubuntu"] a { color:#1a5fb4; }
  html[data-theme="ubuntu"] :is(button,input,summary,.pg):focus-visible { outline:2px solid #e95420; outline-offset:2px; box-shadow:none; }
  html[data-theme="ubuntu"] .scene { display:none; }
  html[data-theme="ubuntu"] .scene-ub { display:block; position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; background:#0b0418; }
  html[data-theme="ubuntu"] .scene-ub svg { display:block; width:100%; height:100%; }
  html[data-theme="ubuntu"] .ub-shell { display:block; }
  html[data-theme="ubuntu"] body { padding:27px 0 0 64px; }

  .ub-panel { position:fixed; z-index:60; top:0; left:0; right:0; height:27px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:0 12px; background:#000; color:#fff; font-size:13.5px; font-weight:500; letter-spacing:.1px; }
  .ub-panel .ub-clock { text-align:center; }
  .ub-panel .ub-tray { justify-self:end; display:flex; align-items:center; gap:11px; }
  .ub-panel .ub-tray svg { width:16px; height:16px; }
  .ub-dock { position:fixed; z-index:55; left:0; top:27px; bottom:0; width:64px; padding:10px 0; display:flex; flex-direction:column; align-items:center; gap:9px;
    background:rgba(32,16,38,.8); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-right:1px solid rgba(255,255,255,.06); }
  .ub-dock .app { position:relative; width:48px; height:48px; display:grid; place-items:center; border-radius:11px; }
  .ub-dock .app svg { width:40px; height:40px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .ub-dock .app.on { background:rgba(255,255,255,.1); }
  .ub-dock .app.on::before { content:""; position:absolute; left:-8px; top:50%; width:6px; height:6px; margin-top:-3px; border-radius:50%; background:#e95420; }
  .ub-dock .grow { flex:1; }

  html[data-theme="ubuntu"] .win { max-width:940px; margin:30px auto 60px; padding:0; border:1px solid #b5b1ac; border-radius:12px; background:#fafaf8;
    -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:0 0 0 1px rgba(0,0,0,.3), 0 18px 48px rgba(0,0,0,.6); }
  html[data-theme="ubuntu"] .titlebar { position:relative; height:46px; gap:0; padding:0 12px 0 14px; border-radius:11px 11px 0 0;
    background:linear-gradient(#f5f4f2, #e6e4e1); border-bottom:1px solid #c9c5c0; }
  html[data-theme="ubuntu"] .titlebar svg.appico { display:none; }
  html[data-theme="ubuntu"] h1 { position:absolute; left:0; right:0; text-align:center; font-size:15px; font-weight:700; color:#2e3436; text-shadow:none; pointer-events:none; }
  html[data-theme="ubuntu"] .caps { align-self:center; margin:0 0 0 auto; gap:9px; position:relative; }
  html[data-theme="ubuntu"] .caps button { width:26px; height:26px; margin:0; border:0; border-radius:50%; color:#2e3436; background:#dcd9d5; box-shadow:none; }
  html[data-theme="ubuntu"] .caps button::after { content:none; }
  html[data-theme="ubuntu"] .caps .c3 { color:#fff; background:#e95420; }
  html[data-theme="ubuntu"] .caps button:hover:not(:disabled) { background:#cfcbc6; box-shadow:none; }
  html[data-theme="ubuntu"] .caps .c3:hover:not(:disabled) { background:#f06535; box-shadow:none; }
  html[data-theme="ubuntu"] .caps button:active:not(:disabled) { background:#bdb8b2; box-shadow:none; }
  html[data-theme="ubuntu"] .caps .c3:active:not(:disabled) { background:#c7431b; box-shadow:none; }
  html[data-theme="ubuntu"] .caps .ia, html[data-theme="ubuntu"] .caps .it { display:none; }
  html[data-theme="ubuntu"] .caps .iu { display:block; width:16px; height:16px; }
  html[data-theme="ubuntu"] .addr { padding:10px 14px 8px; background:#fafaf8; }
  html[data-theme="ubuntu"] .abar { padding:2px 0; background:none; border:0; box-shadow:none; }
  html[data-theme="ubuntu"] .abar svg { width:22px; height:22px; }
  html[data-theme="ubuntu"] .client { background:#fafaf8; border:0; box-shadow:none; border-radius:0 0 11px 11px; }
  html[data-theme="ubuntu"] .status { background:#efeeec; border-top:1px solid #d8d4cf; color:#5d6366; border-radius:0 0 11px 11px; }

<script>
(() => {
  const $ = id => document.getElementById(id);
  const HAS_COUNTER = /*HAS_COUNTER*/;

  // ---------- i18n ----------
  const I18N = {

      m_tui: 'โหมดเทอร์มินัล (TUI)', m_ub: 'โหมด Ubuntu', m_back: 'กลับเป็นหน้าตา Windows 7',
      priv_head: 'ไฟล์ของคุณไม่ออกจากเครื่อง',
      priv_body: 'ทุกอย่างประมวลผลในเบราว์เซอร์ของคุณเท่านั้น ไม่มีการอัปโหลด ไม่มีเซิร์ฟเวอร์รับไฟล์ และไม่เก็บข้อมูลจากไฟล์ของคุณเด็ดขาด',
      priv_counter: 'สิ่งเดียวที่นับคือจำนวนผู้เข้าชมหน้านี้แบบไม่ระบุตัวตน (GoatCounter: ไม่ใช้ cookie ไม่เก็บ IP เต็ม ไม่เห็นชื่อไฟล์หรือเนื้อหาไฟล์) และจะไม่นับถ้าเบราว์เซอร์ของคุณเปิด Do Not Track',
      priv_nocounter: 'หน้านี้ไม่มีการติดตามผู้ใช้ใด ๆ ทั้งสิ้น',
      priv_verify_title: 'ตรวจสอบเองได้อย่างไร',
      priv_v1: 'เปิด DevTools (F12) แท็บ Network แล้วลองตัดไฟล์ จะไม่มี request ใดส่งข้อมูลไฟล์ออกไป',
      priv_v2: 'หน้านี้ตั้ง Content-Security-Policy ให้เบราว์เซอร์บล็อกการเชื่อมต่อออกนอกเครื่องเอง (ดูได้ใน view-source)',
      priv_v3: 'บันทึกหน้านี้เป็นไฟล์ .html แล้วปิดอินเทอร์เน็ต ก็ยังใช้งานได้ตามปกติ',
      priv_v4: 'ดูซอร์สโค้ดทั้งหมดบน GitHub',
      drop: 'ลากไฟล์ PDF มาวางตรงนี้ หรือคลิกเพื่อเลือกไฟล์',
      choose: 'เลือกไฟล์ PDF',
      all: 'เลือกทั้งหมด', none: 'ล้าง', inv: 'กลับด้าน', odd: 'คี่', even: 'คู่',
      range_ph: 'เช่น 1-3, 5, 8-10',
      extract: 'ตัดหน้าที่เลือกเป็น 1 ไฟล์', each: 'แยกทีละหน้า (หลายไฟล์)', del: 'ลบหน้าที่เลือกทิ้ง', other: 'เปลี่ยนไฟล์',
      howto: 'คลิกที่หน้าเพื่อเลือก · Shift+คลิก เลือกเป็นช่วง · พิมพ์ช่วงหน้าในช่องด้านบนได้',
      foot: 'ใช้ pdf-lib (MIT) และ PDF.js (Apache-2.0) · ซอฟต์แวร์ให้ใช้ตามสภาพ ไม่มีการรับประกัน',
      pages: n => `${n} หน้า`, page: n => `หน้า ${n}`,
      none_sel: 'ยังไม่ได้เลือกหน้า', sel_info: (n, t) => `เลือกแล้ว ${n} จาก ${t} หน้า`,
      loading: 'กำลังโหลดตัวอย่างหน้า...', not_pdf: 'ต้องเป็นไฟล์ PDF นะคะ', open_fail: m => `เปิดไฟล์ไม่ได้: ${m}`,
      err: m => `ผิดพลาด: ${m}`, done_pages: n => `เสร็จแล้ว ${n} หน้า`, done_left: n => `เสร็จแล้ว เหลือ ${n} หน้า`, done_files: n => `เสร็จแล้ว ${n} ไฟล์`,
      confirm_many: n => `จะดาวน์โหลด ${n} ไฟล์ต่อเนื่องกัน ถ้าเบราว์เซอร์ถามให้กดอนุญาต ตกลงมั้ยคะ?`
    },
    en: {
      tagline: 'Free PDF page splitter. Runs entirely on your device.',
      close: 'Close',
      dl: 'Download offline copy',
      dl_tip: 'One file, no visit counter, every network connection blocked. Works with the internet switched off.',
      m_tui: 'Terminal mode (TUI)', m_ub: 'Ubuntu mode', m_back: 'Back to the Windows 7 look',
      priv_head: 'Your files never leave your device.',
      priv_body: 'Everything is processed inside your own browser. No upload, no server that receives files, and nothing from your files is ever stored.',
      priv_counter: 'The only thing counted is the number of visitors to this page, anonymously (GoatCounter: no cookies, no full IP stored, it never sees file names or contents). Nothing is counted if your browser sends Do Not Track.',
      priv_nocounter: 'This page does not track its users in any way.',
      priv_verify_title: 'How to verify this yourself',
      priv_v1: 'Open DevTools (F12), go to the Network tab, then split a file. No request carries your file data anywhere.',
      priv_v2: 'The page sets a Content-Security-Policy so the browser itself blocks outbound connections (see view-source).',
      priv_v3: 'Save this page as an .html file, go offline, and it still works.',
      priv_v4: 'Read the full source code on GitHub',
      drop: 'Drop a PDF here, or click to choose a file',
      choose: 'Choose PDF file',
      all: 'Select all', none: 'Clear', inv: 'Invert', odd: 'Odd', even: 'Even',
      range_ph: 'e.g. 1-3, 5, 8-10',
      extract: 'Extract selected into 1 file', each: 'Split into one file per page', del: 'Delete selected pages', other: 'Change file',
      howto: 'Click a page to select · Shift+click selects a range · or type a page range above',
      foot: 'Built with pdf-lib (MIT) and PDF.js (Apache-2.0) · Provided as is, without warranty',
      pages: n => `${n} pages`, page: n => `Page ${n}`,
      none_sel: 'No pages selected', sel_info: (n, t) => `${n} of ${t} pages selected`,
      loading: 'Loading page previews...', not_pdf: 'Please choose a PDF file.', open_fail: m => `Could not open file: ${m}`,
      err: m => `Error: ${m}`, done_pages: n => `Done, ${n} pages`, done_left: n => `Done, ${n} pages remain`, done_files: n => `Done, ${n} files`,
      confirm_many: n => `This will download ${n} files in a row. If the browser asks, allow multiple downloads. Continue?`
    }
  };
  // Language-locked pages (/th/, /en/) set FIXED_LANG; the auto-detect page leaves it empty.
  const FIXED_LANG = '/*FIXEDLANG*/', SIBLING = '/*SIBLING*/';
  const qLang = new URLSearchParams(location.search).get('lang');
  let lang = FIXED_LANG || ((qLang === 'en' || qLang === 'th') ? qLang : ((navigator.language || 'th').toLowerCase().startsWith('th') ? 'th' : 'en'));
  const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };

  let bytes = null, baseName = 'document', total = 0, sel = new Set(), last = null, cells = [];

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-about]').forEach(e => { e.hidden = e.dataset.about !== lang; });
    document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
    document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
    $('privCounter').textContent = t(HAS_COUNTER ? 'priv_counter' : 'priv_nocounter');
    $('lcode').textContent = lang.toUpperCase();
    const dlEl = $('dl'); if (dlEl) dlEl.title = t('dl_tip');
    labelCaps(); tickClock();
    $('bClose').setAttribute('aria-label', t('close'));
    if (total) { $('count').textContent = t('pages', total); cells.forEach((c, i) => c && (c.querySelector('.n').textContent = t('page', i))); }
    refresh(false);
  }
  $('lang').onclick = () => {
    if (FIXED_LANG && SIBLING) { location.href = SIBLING + location.search.replace(/([?&])lang=[^&]*&?/, '$1').replace(/[?&]$/, '') + location.hash; return; }
    lang = lang === 'th' ? 'en' : 'th'; applyLang();
  };

  // ---------- Themes: minimize = terminal (TUI), maximize = Ubuntu, press again to go back ----------
  const themeColor = { aero: '#3a9be0', ubuntu: '#300a24', tui: '#000000' };
  let theme = 'aero', clockTimer = 0;
  function labelCaps() {
    const a = $('bMin'), b = $('bMax');
    const la = t(theme === 'tui' ? 'm_back' : 'm_tui'), lb = t(theme === 'ubuntu' ? 'm_back' : 'm_ub');
    a.title = la; a.setAttribute('aria-label', la); b.title = lb; b.setAttribute('aria-label', lb);
    a.setAttribute('aria-pressed', String(theme === 'tui')); b.setAttribute('aria-pressed', String(theme === 'ubuntu'));
  }
  function tickClock() {
    clearTimeout(clockTimer);
    if (theme !== 'ubuntu') return;
    $('ubClock').textContent = new Date().toLocaleString(lang === 'th' ? 'th-TH' : 'en-GB',
      { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    clockTimer = setTimeout(tickClock, 20000);
  }
  function setTheme(n) {
    theme = themeColor[n] ? n : 'aero';
    if (theme === 'aero') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor[theme]);
    labelCaps(); tickClock();
  }
  $('bMin').onclick = () => setTheme(theme === 'tui' ? 'aero' : 'tui');
  $('bMax').onclick = () => setTheme(theme === 'ubuntu' ? 'aero' : 'ubuntu');
  setTheme(new URLSearchParams(location.search).get('theme'));


  // ---------- Easter egg: the fake close button points at the browser's real one ----------
  const oops = $('oops'), cur = $('oopsCur'), tip = $('oopsTip'), bClose = $('bClose');
  let oopsAnims = [], oopsTimer = 0;
  function oopsStop() {
    clearTimeout(oopsTimer);
    oopsAnims.forEach(a => a.cancel()); oopsAnims = [];
    oops.classList.add('hide'); oops.setAttribute('aria-hidden', 'true');
    bClose.classList.remove('nope');
  }
  bClose.onclick = () => {
    oopsStop();
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const r = bClose.getBoundingClientRect();
    const sx = r.left + r.width / 2, sy = r.top + r.height / 2;   // where the pointer "clicked"
    const ex = innerWidth - 30, ey = 3;                           // tip ends near the real close button
    oops.classList.remove('hide'); oops.setAttribute('aria-hidden', 'false');
    void bClose.offsetWidth; if (!calm) bClose.classList.add('nope');
    const at = (x, y, s, fx) => `translate(${x}px,${y}px) scale(${fx ? -s : s},${s})`;
    const go = (el, frames, o) => { const a = el.animate(frames, Object.assign({ fill: 'forwards' }, o)); oopsAnims.push(a); return a; };
    if (calm) {
      go(cur, [{ opacity: 1, transform: at(ex, ey, 1, true) }, { opacity: 1, transform: at(ex, ey, 1, true) }], { duration: 10 });
      go(tip, [{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
    } else {
      // 1) pointer appears on the button, 2) flips and slides to the top-right corner, 3) nudges toward the real X
      go(cur, [
        { opacity: 0, transform: at(sx, sy, .7, false), offset: 0 },
        { opacity: 1, transform: at(sx, sy, 1, false), offset: .12 },
        { opacity: 1, transform: at(sx, sy, 1, false), offset: .26 },
        { opacity: 1, transform: at(sx, sy, 1, true), offset: .34, easing: 'cubic-bezier(.3,.05,.2,1)' },
        { opacity: 1, transform: at(ex, ey, 1, true), offset: .68 },
        { opacity: 1, transform: at(ex + 5, ey - 3, 1, true), offset: .76 },
        { opacity: 1, transform: at(ex, ey, 1, true), offset: .84 },
        { opacity: 1, transform: at(ex + 5, ey - 3, 1, true), offset: .92 },
        { opacity: 1, transform: at(ex, ey, 1, true), offset: 1 }
      ], { duration: 2200 });
      go(tip, [
        { opacity: 0, transform: 'scale(.6)', offset: 0 },
        { opacity: 0, transform: 'scale(.6)', offset: .62 },
        { opacity: 1, transform: 'scale(1.06)', offset: .74 },
        { opacity: 1, transform: 'scale(1)', offset: .8 },
        { opacity: 1, transform: 'scale(1)', offset: 1 }
      ], { duration: 2200 });
    }
    oopsTimer = setTimeout(() => {
      const f = [{ opacity: 1 }, { opacity: 0 }];
      go(cur, f, { duration: 350 }); go(tip, f, { duration: 350 }).onfinish = oopsStop;
    }, (calm ? 200 : 2200) + 1800);
  };
  addEventListener('keydown', e => { if (e.key === 'Escape') oopsStop(); });

  // ---------- pdf.js worker (from inline blob, no network) ----------
  // file:// pages have an opaque origin, so a blob: Worker cannot start there. In that case the worker
  // code (already inlined in this file) is run as an inline script, which PDF.js then uses in-thread.
  if (location.protocol === 'file:') {
    const ws = document.createElement('script');
    ws.textContent = $('workersrc').textContent;
    document.head.appendChild(ws);
  }
  const wblob = new Blob([$('workersrc').textContent], {type: 'text/javascript'});
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(wblob);

  const drop = $('drop'), fileIn = $('file');
  drop.onclick = () => fileIn.click();
  $('bChoose').onclick = ev => { ev.stopPropagation(); fileIn.click(); };
  fileIn.onchange = () => fileIn.files[0] && load(fileIn.files[0]);
  ['dragenter','dragover'].forEach(e => document.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(e => document.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  document.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) load(f); });
  $('bOther').onclick = () => { $('work').classList.add('hide'); drop.classList.remove('hide'); fileIn.value=''; bytes = null; total = 0; flash(''); };

  async function load(f) {
    if (f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')) return flash(t('not_pdf'));
    bytes = new Uint8Array(await f.arrayBuffer());
    baseName = f.name.replace(/\.pdf$/i, '');
    sel.clear(); last = null; $('grid').innerHTML = ''; cells = []; total = 0;
    drop.classList.add('hide'); $('work').classList.remove('hide');
    $('fname').textContent = f.name;
    flash(t('loading'));
    let doc;
    try { doc = await pdfjsLib.getDocument({data: bytes.slice()}).promise; }
    catch (e) { flash(t('open_fail', e.message)); return; }
    total = doc.numPages;
    $('count').textContent = t('pages', total);
    for (let i = 1; i <= total; i++) {
      const d = document.createElement('div'); d.className = 'pg';
      d.innerHTML = '<svg class="ck" aria-hidden="true" focusable="false"><use href="#i-check"/></svg><canvas></canvas><div class="n"></div>';
      d.tabIndex = 0; d.setAttribute('role', 'checkbox'); d.setAttribute('aria-checked', 'false');
      d.onkeydown = ev => { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); click(i, ev.shiftKey); } };
      d.querySelector('.n').textContent = t('page', i);
      d.onclick = ev => click(i, ev.shiftKey);
      $('grid').appendChild(d); cells[i] = d;
    }
    refresh(true);
    for (let i = 1; i <= total; i++) {
      const page = await doc.getPage(i);
      const vp = page.getViewport({scale: 0.4});
      const c = cells[i].querySelector('canvas');
      c.width = vp.width; c.height = vp.height;
      await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    }
    flash('');
  }

  function click(i, shift) {
    if (shift && last) {
      const [a, b] = [Math.min(last, i), Math.max(last, i)];
      const on = !sel.has(i);
      for (let k = a; k <= b; k++) on ? sel.add(k) : sel.delete(k);
    } else { sel.has(i) ? sel.delete(i) : sel.add(i); }
    last = i; refresh(true);
  }

  function toRange(set) {
    const a = [...set].sort((x, y) => x - y), out = [];
    for (let i = 0; i < a.length; ) {
      let j = i; while (j + 1 < a.length && a[j+1] === a[j] + 1) j++;
      out.push(j > i ? `${a[i]}-${a[j]}` : `${a[i]}`); i = j + 1;
    }
    return out.join(', ');
  }
  function parseRange(s) {
    const set = new Set();
    for (const part of s.split(/[,\s]+/).filter(Boolean)) {
      const m = part.match(/^(\d+)(?:-(\d+))?$/); if (!m) continue;
      let a = +m[1], b = m[2] ? +m[2] : a; if (a > b) [a, b] = [b, a];
      for (let k = Math.max(1, a); k <= Math.min(total, b); k++) set.add(k);
    }
    return set;
  }
  function refresh(syncInput) {
    cells.forEach((c, i) => { if (c) { c.classList.toggle('sel', sel.has(i)); c.setAttribute('aria-checked', sel.has(i)); } });
    if (syncInput) $('range').value = toRange(sel);
    const n = sel.size;
    $('selInfo').textContent = n ? t('sel_info', n, total) : t('none_sel');
    $('bExtract').disabled = !n; $('bEach').disabled = !n; $('bDelete').disabled = !n || n === total;
  }
  $('range').oninput = () => { sel = parseRange($('range').value); refresh(false); };
  const allPages = () => Array.from({length: total}, (_, k) => k + 1);
  $('bAll').onclick = () => { sel = new Set(allPages()); refresh(true); };
  $('bNone').onclick = () => { sel.clear(); refresh(true); };
  $('bInv').onclick = () => { sel = new Set(allPages().filter(k => !sel.has(k))); refresh(true); };
  $('bOdd').onclick = () => { sel = new Set(allPages().filter(k => k % 2)); refresh(true); };
  $('bEven').onclick = () => { sel = new Set(allPages().filter(k => !(k % 2))); refresh(true); };

  function flash(m) { $('msg').textContent = m; }
  function save(u8, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([u8], {type: 'application/pdf'}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  async function build(pages) {
    const src = await PDFLib.PDFDocument.load(bytes, {ignoreEncryption: true});
    const out = await PDFLib.PDFDocument.create();
    const copied = await out.copyPages(src, pages.map(p => p - 1));
    copied.forEach(p => out.addPage(p));
    return out.save();
  }
  const sorted = () => [...sel].sort((a, b) => a - b);
  async function run(fn) { try { await fn(); } catch (e) { flash(t('err', e.message)); console.error(e); } }

  $('bExtract').onclick = () => run(async () => {
    const p = sorted(); save(await build(p), `${baseName}_p${toRange(sel).replace(/, /g, '_')}.pdf`); flash(t('done_pages', p.length));
  });
  $('bDelete').onclick = () => run(async () => {
    const keep = allPages().filter(k => !sel.has(k));
    save(await build(keep), `${baseName}_removed.pdf`); flash(t('done_left', keep.length));
  });
  $('bEach').onclick = () => run(async () => {
    const p = sorted();
    if (p.length > 10 && !confirm(t('confirm_many', p.length))) return;
    for (const n of p) { save(await build([n]), `${baseName}_page${String(n).padStart(3, '0')}.pdf`); await new Promise(r => setTimeout(r, 250)); }
    flash(t('done_files', p.length));
  });

  applyLang();

  // ---------- optional anonymous visit counter (build-time switch) ----------
  /*COUNTER*/
})();
</script>
</body>
</html>
