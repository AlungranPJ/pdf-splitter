name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Optional anonymous visit counter: set repo variable GOATCOUNTER_CODE.
      # Leave it unset and the built page contains no tracking code at all.
      - name: Build pages, offline copy and SEO files
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: python build.py
      - name: Stage site
        run: |
          mkdir _site
          cp index.html pdf-splitter-offline.html sitemap.xml robots.txt og-th.png og-en.png _site/
          mkdir _site/th _site/en
          cp th/index.html _site/th/
          cp en/index.html _site/en/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
